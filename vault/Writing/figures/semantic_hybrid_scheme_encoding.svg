<svg xmlns="http://www.w3.org/2000/svg" width="920" height="260" viewBox="0 0 920 260">
  <rect width="920" height="260" fill="#ffffff"/>
  <style>
    .title { font: 700 18px Arial, sans-serif; fill: #111827; }
    .label { font: 700 15px Arial, sans-serif; fill: #111827; }
    .small { font: 13px Arial, sans-serif; fill: #374151; }
    .gene { font: 700 18px Arial, sans-serif; fill: #111827; }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.4; rx: 4; }
    .group1 { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.2; rx: 5; }
    .group2 { fill: #ecfdf5; stroke: #059669; stroke-width: 1.2; rx: 5; }
    .group3 { fill: #fef3c7; stroke: #d97706; stroke-width: 1.2; rx: 5; }
    .group4 { fill: #fce7f3; stroke: #db2777; stroke-width: 1.2; rx: 5; }
  </style>

  <text x="460" y="28" text-anchor="middle" class="title">Semantic Hybrid-Scheme Encoding</text>

  <rect x="35" y="64" width="135" height="72" class="box"/>
  <rect x="185" y="64" width="135" height="72" class="box"/>
  <rect x="335" y="64" width="135" height="72" class="box"/>
  <rect x="485" y="64" width="135" height="72" class="box"/>
  <rect x="635" y="64" width="135" height="72" class="box"/>
  <rect x="785" y="64" width="100" height="72" class="box"/>

  <text x="102.5" y="98" text-anchor="middle" class="gene">h0</text>
  <text x="102.5" y="120" text-anchor="middle" class="small">parent 1</text>
  <text x="252.5" y="98" text-anchor="middle" class="gene">h1</text>
  <text x="252.5" y="120" text-anchor="middle" class="small">parent 2</text>
  <text x="402.5" y="98" text-anchor="middle" class="gene">h2</text>
  <text x="402.5" y="120" text-anchor="middle" class="small">OL 1</text>
  <text x="552.5" y="98" text-anchor="middle" class="gene">h3</text>
  <text x="552.5" y="120" text-anchor="middle" class="small">OL 2</text>
  <text x="702.5" y="98" text-anchor="middle" class="gene">h4</text>
  <text x="702.5" y="120" text-anchor="middle" class="small">OO</text>
  <text x="835" y="98" text-anchor="middle" class="gene">h5</text>
  <text x="835" y="120" text-anchor="middle" class="small">survivor</text>

  <rect x="35" y="158" width="285" height="62" class="group1"/>
  <rect x="335" y="158" width="285" height="62" class="group2"/>
  <rect x="635" y="158" width="135" height="62" class="group3"/>
  <rect x="785" y="158" width="100" height="62" class="group4"/>

  <text x="177.5" y="184" text-anchor="middle" class="label">Parent Algorithms</text>
  <text x="177.5" y="205" text-anchor="middle" class="small">Table II, h0 != h1</text>
  <text x="477.5" y="184" text-anchor="middle" class="label">Operating Levels (OL)</text>
  <text x="477.5" y="205" text-anchor="middle" class="small">Table III</text>
  <text x="702.5" y="184" text-anchor="middle" class="label">Operating Order (OO)</text>
  <text x="702.5" y="205" text-anchor="middle" class="small">Table IV</text>
  <text x="835" y="184" text-anchor="middle" class="label">Survival</text>
  <text x="835" y="205" text-anchor="middle" class="small">Table V</text>

  <path d="M102.5 136 L102.5 158" stroke="#64748b" stroke-width="1.2"/>
  <path d="M252.5 136 L252.5 158" stroke="#64748b" stroke-width="1.2"/>
  <path d="M402.5 136 L402.5 158" stroke="#64748b" stroke-width="1.2"/>
  <path d="M552.5 136 L552.5 158" stroke="#64748b" stroke-width="1.2"/>
  <path d="M702.5 136 L702.5 158" stroke="#64748b" stroke-width="1.2"/>
